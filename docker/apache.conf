<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html
    ServerSignature Off
    ProxyRequests Off
    ProxyPass "/zing/" "http://127.0.0.1:8877/" connectiontimeout=5 timeout=30
    ProxyPassReverse "/zing/" "http://127.0.0.1:8877/"
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "^(db_connect|db_options)\.php$">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options nosniff
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
